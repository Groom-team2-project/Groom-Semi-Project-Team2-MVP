spring:
    profiles:
        default: local

    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 6MB

    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}

    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                show_sql: true
                format_sql: true

redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    # leaseTime을 지정하지 않은 Redisson 락의 watchdog TTL입니다.
    lock-watchdog-timeout-ms: ${REDIS_LOCK_WATCHDOG_TIMEOUT_MS:30000}

springdoc:
    swagger-ui:
        path: /swagger-ui.html
        tags-sorter: alpha
        operations-sorter: method
    api-docs:
        path: /v3/api-docs

kakao:
    oauth:
        client-id: ${KAKAO_CLIENT_ID:}
        client-secret: ${KAKAO_CLIENT_SECRET:}
        redirect-uri: ${KAKAO_REDIRECT_URI:}
        token-uri: https://kauth.kakao.com/oauth/token
        issuer-uri: https://kauth.kakao.com

app:
    jwt:
        secret: ${JWT_SECRET}
        access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:7200}
        refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}
    oauth:
        cookie-secure: ${OAUTH_COOKIE_SECURE:true}
    storage:
        bucket: ${AWS_S3_BUCKET} #버킷이름
        region: ${AWS_REGION:us-west-2} #버킷리전
        public-base-url: ${IMAGE_PUBLIC_BASE_URL} #이미지를 조회할 기본 주소 https://goorm-dev-mmy.s3.us-west-2.amazonaws.com
