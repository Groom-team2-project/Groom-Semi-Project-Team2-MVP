spring:
    profiles:
        default: local

    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}

    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                show_sql: true
                format_sql: true

redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    # leaseTime을 지정하지 않은 Redisson 락의 watchdog TTL입니다.
    lock-watchdog-timeout-ms: ${REDIS_LOCK_WATCHDOG_TIMEOUT_MS:30000}

cart:
    reservation:
        expiry:
            # 미결제 주문의 예약 재고 회수. 결제창을 닫아버린 주문이 재고를 영구히
            # 잠식하는 것을 막는다. 여러 인스턴스로 배포하면 한 대만 켜는 편이 낫다.
            enabled: ${CART_RESERVATION_EXPIRY_ENABLED:true}
            # 이 시간이 지나도록 결제되지 않으면 예약을 푼다. (결제 제한시간보다 넉넉해야 한다)
            timeout: ${CART_RESERVATION_EXPIRY_TIMEOUT:PT30M}
            # 회수 작업 실행 주기
            interval: ${CART_RESERVATION_EXPIRY_INTERVAL:PT1M}
            # 한 주기에 처리할 최대 주문 수
            batch-size: ${CART_RESERVATION_EXPIRY_BATCH_SIZE:100}

springdoc:
    swagger-ui:
        path: /swagger-ui.html
        tags-sorter: alpha
        operations-sorter: method
    api-docs:
        path: /v3/api-docs

kakao:
    oauth:
        client-id: ${KAKAO_CLIENT_ID:}
        client-secret: ${KAKAO_CLIENT_SECRET:}
        redirect-uri: ${KAKAO_REDIRECT_URI:}
        token-uri: https://kauth.kakao.com/oauth/token
        issuer-uri: https://kauth.kakao.com

app:
    jwt:
        secret: ${JWT_SECRET}
        access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:7200}
        refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}
    oauth:
        cookie-secure: ${OAUTH_COOKIE_SECURE:true}
