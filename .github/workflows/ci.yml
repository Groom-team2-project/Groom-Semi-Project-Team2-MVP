name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle 권한 부여
        run: chmod +x gradlew

      - name: Backend 컴파일
        run: ./gradlew clean compileJava

  frontend-v2:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-v2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: Frontend 빌드
        run: npm run build

  docker-compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker compose 검증
        run: docker compose config