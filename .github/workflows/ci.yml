name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle 권한 부여
        run: chmod +x gradlew

      - name: Backend 컴파일
        run: ./gradlew clean compileJava

  frontend-v2:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-v2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: Frontend 빌드
        run: npm run build

  docker-compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: CI env 파일 준비
        run: cp .env.example .env

      - name: Docker compose 검증
        run: docker compose config

  docker-build:
    runs-on: ubuntu-latest
    needs: [ backend, frontend-v2, docker-compose ]

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actior }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: chmod +x gradlew

      - name: Backend Jar 빌드
        run: ./gradlew clean bootJar

      - name: Backend 이미지 빌드
        run:
          docker build -f docker/backend/Dockerfile \
          -t ghcr.io/${{ github.repository }}/backend:${{ github.sha }} \ 
          -t ghcr.io/${{ github.repository }}/backend:lastest \
          .
          docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/backend:lastest

      - name: Frontend 이미지 빌드
        run:
          docker build -f frontend-v2/Dockerfile \
          -t ghcr.io/${{ github.repository }}/frontend-v2:${{ github.sha }} \
          -t ghcr.io/${{ github.repository }}/frontend-v2:latest \
          ./frontend-v2
          docker push ghcr.io/${{ github.repository }}/frontend-v2:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/frontend-v2:latest

  docker-push:
    runs-on: ubuntu-latest
    needs: [backend, frontend-v2, docker-compose]

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: chmod +x gradlew

      - name: Backend Jar 빌드
        run: ./gradlew clean bootJar

      - name: Backend 이미지 빌드 및 Push
        run: |
          docker build -f docker/backend/Dockerfile \
            -t ${{ env.IMAGE_NAMESPACE }}/backend:${{ github.sha }} \
            -t ${{ env.IMAGE_NAMESPACE }}/backend:latest \
            .
          docker push ${{ env.IMAGE_NAMESPACE }}/backend:${{ github.sha }}
          docker push ${{ env.IMAGE_NAMESPACE }}/backend:latest

      - name: Frontend-v2 이미지 빌드 및 Push
        run: |
          docker build -f frontend-v2/Dockerfile \
            -t ${{ env.IMAGE_NAMESPACE }}/frontend-v2:${{ github.sha }} \
            -t ${{ env.IMAGE_NAMESPACE }}/frontend-v2:latest \
            ./frontend-v2
          docker push ${{ env.IMAGE_NAMESPACE }}/frontend-v2:${{ github.sha }}
          docker push ${{ env.IMAGE_NAMESPACE }}/frontend-v2:latest