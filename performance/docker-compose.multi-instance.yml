x-performance-app: &performance-app
  image: groommvp-performance-app:local
  build:
    context: .
    dockerfile: performance/Dockerfile
  restart: "no"
  environment:
    SPRING_PROFILES_ACTIVE: local,performance
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-buying_mvp}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    SPRING_DATASOURCE_USERNAME: root
    SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    JWT_SECRET: ${JWT_SECRET:-local-performance-jwt-secret-key}
    KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
    KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
    KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:18080/api/v1/auth/kakao/callback}
    OAUTH_COOKIE_SECURE: "false"
    TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-test_performance_secret}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    EVENT_LOCK_STRATEGY: ${EVENT_LOCK_STRATEGY:-distributed}
    CART_RESERVATION_EXPIRY_ENABLED: "false"
    JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - groom-mvp-network

services:
  app-1:
    <<: *performance-app
    container_name: groom-mvp-perf-app-1
    ports:
      - "${PERFORMANCE_APP1_PORT:-18081}:8080"

  app-2:
    <<: *performance-app
    container_name: groom-mvp-perf-app-2
    ports:
      - "${PERFORMANCE_APP2_PORT:-18082}:8080"

  performance-gateway:
    image: nginx:1.27-alpine
    container_name: groom-mvp-perf-gateway
    restart: "no"
    ports:
      - "${PERFORMANCE_GATEWAY_PORT:-18080}:80"
    volumes:
      - ./performance/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
    networks:
      - groom-mvp-network
